name: AI Issue handling
on:
  issues:
    types: [labeled]

jobs:
  fix-issue:
    if: gitea.event.issue.labels[0].name == 'ai-fix'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install aider
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install aider-chat

      - name: Make the change
        env:
          OPENAI_API_BASE: ${{ secrets.LOCALAI_URL }}
          OPENAI_API_KEY: ${{ secrets.LOCALAI_KEY }}
          MODEL_NAME: qwen3.8-27b
        run: |
          git config user.name "ai-bot"
          git config user.email "ai-bot@example.com"
          git checkout -b ai/issue-${{ gitea.event.issue.number }}
          /tmp/venv/bin/aider --model "openai/${MODEL_NAME}" --yes-always --no-auto-lint \
            --message "Resolve this issue. Title: ${{ gitea.event.issue.title }}. Details: ${{ gitea.event.issue.body }}"

      - name: Push and open PR
        env:
          TOKEN: ${{ secrets.AI_BOT_TOKEN }}
        run: |
          BRANCH=ai/issue-${{ gitea.event.issue.number }}
          git push origin "$BRANCH"
          jq -n --arg t "AI: ${{ gitea.event.issue.title }}" \
                --arg h "$BRANCH" \
                --arg b "Automated attempt at #${{ gitea.event.issue.number }}. Please review carefully." \
                '{title:$t, head:$h, base:"main", body:$b}' > pr.json
          curl -s -X POST \
            "${{ gitea.server_url }}/api/v1/repos/${{ gitea.repository }}/pulls" \
            -H "Authorization: token $TOKEN" \
            -H "Content-Type: application/json" -d @pr.json
