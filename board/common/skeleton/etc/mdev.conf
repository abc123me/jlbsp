# Syntax:
# [-]devicename_regex user:group mode [=path]|[>path]|[!] [@|$|*cmd args...]
# [-]$ENVVAR=regex    user:group mode [=path]|[>path]|[!] [@|$|*cmd args...]
# [-]@maj,min[-min2]  user:group mode [=path]|[>path]|[!] [@|$|*cmd args...]
#
# [-]: do not stop on this match, continue reading mdev.conf
# =: move, >: move and create a symlink
# !: do not create device node
# @|$|*: run cmd if $ACTION=remove, @cmd if $ACTION=add, *cmd in all cases

# Video devices
fb[0-9]        root:video 660
vbi[0-9]       root:video 660
video[0-9]     root:video 660

# Block devices
sd[a-z].*      root:disk  660 */lib/mdev/usbdisk_link
md[0-9]*       root:disk  660
mmc[0-9].*     root:disk  660

# Serial / TTY devices
ttyAMA[0-9]*   root:tty   660
ttyACM[0-9]*   root:tty   660
ttyUSB[0-9]*   root:tty   660

# PPS / PTP / RTC
pps[0-9]*      root:pps   660
ptp[0-9]*      root:ptp   660

# I2C / SPI / GPIO
i2c.*          root:i2c   660
gpiochip[0-9]* root:gpio  660

# Misc devices
null           root:root  666
zero           root:root  666
random         root:root  666
urandom        root:root  444
psaux          root:root  660
rtc            root:root  664

