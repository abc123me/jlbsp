image boot.vfat {
	vfat {
		files = {
			"Image",
			"system.dtb",
		}
	}
	size = 128M
}
image sdcard.img {
	hdimage {
	}
	partition bootloader {
		in-partition-table = false
		offset = 512
		image = "amlogic-boot-fip/out/u-boot.bin"
	}
	partition boot {
		partition-type = 0xC
		bootable = "true"
		offset = 1M
		image = "boot.vfat"
	}
	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext4"
	}
}
