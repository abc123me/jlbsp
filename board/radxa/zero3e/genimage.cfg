image boot.vfat {
	vfat {
		files = {
			"Image",
			"rk3566-radxa-zero-3e.dtb",
		}
	}
	size = 64M
}

image sdcard.img {
	hdimage {
	}

	partition tpl-spl {
		in-partition-table = "no"
		image = "u-boot-rockchip.bin"
		offset = 32K
	}

	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
		offset = 16M
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext4"
	}
}
