image boot.vfat {
	vfat {
		files = {
			"Image",
			"system.dtb",
		}
		file extlinux/extlinux.conf {
			image = "extlinux.conf"
		}
	}
	size = 32M
}
image sdcard.img {
	hdimage {
	}
	partition bootloader {
		in-partition-table = false
		image = "u-boot-sunxi-with-spl.bin"
		offset = 8K
		size = 1016K
	}
	partition boot {
		partition-type = 0x0C
		bootable = "true"
		offset = 1M
		image = "boot.vfat"
	}
	partition rootfs {
		offset = 33M
		image = "rootfs.ext4"
		partition-type = 0x83
	}
}
